name: Update README cards

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/gen_cards.py"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

# Only one run at a time. A second run waits rather than racing the first.
concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 scripts/gen_cards.py

      - name: Commit and push
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/
          if git diff --staged --quiet; then
            echo "No change - nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh README cards"

          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected - rebasing onto latest main (attempt $attempt)."
            git fetch origin main
            git pull --rebase --autostash origin main || {
              echo "Rebase conflict - keeping the freshly generated files."
              git checkout --theirs assets/ 2>/dev/null || true
              git add assets/
              git -c core.editor=true rebase --continue || git rebase --abort
            }
            sleep $((attempt * 5))
          done

          echo "Could not push after 3 attempts."
          exit 1
