name: Update README cards

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/gen_cards.py"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/gen_cards.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg assets/stats.svg
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "chore: refresh README cards"
            git push
          fi
