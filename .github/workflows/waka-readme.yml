name: Waka Readme

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest

    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          
           # --- on: things your profile doesn't already show ---
          SHOW_COMMIT: "True"            # early bird / night owl
          SHOW_DAYS_OF_WEEK: "True"      # most productive day
          SHOW_LANGUAGE: "True"          # hours per language
          SHOW_EDITORS: "True"
          SHOW_PROJECTS: "True"
          SHOW_TOTAL_CODE_TIME: "True"
 
          # --- off: redundant with your cards, or noise ---
          SHOW_PROFILE_VIEWS: "False"
          SHOW_LANGUAGE_PER_REPO: "False"   # your stack icons cover this
          SHOW_SHORT_INFO: "False"          # repo/storage counts, low value
          SHOW_LOC_CHART: "False"           # heavy, slow runs
          SHOW_LINES_OF_CODE: "False"
          SHOW_OS: "False"
 
          SYMBOL_VERSION: "1"
          SHOW_UPDATED_DATE: "True"
          COMMIT_MESSAGE: "chore: update dev metrics"
